name: Publish Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify game and multiplayer engine
        run: node --test tests.mjs development-tests.mjs industry-tests.mjs auto-supply-tests.mjs warfare-tests.mjs client-smoke-tests.mjs adventure-tests.mjs building-model-tests.mjs exchange-tests.mjs property-identity-tests.mjs expansion-tests.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4